# 生产环境配置（容器部署）
# 敏感信息和环境相关项都支持环境变量覆盖，由 deploy.sh 通过 --env-file / -e 注入
server:
  # 与 Dockerfile 的 EXPOSE、deploy.sh 的 -p 保持一致
  port: ${SERVER_PORT:9000}
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
# 注意：logging.config 必须和 logging.level 同级。
# 写在 level 下面会被当成"日志级别"去解析，启动直接报
#   Failed to bind properties under 'logging.level.config'  → APPLICATION FAILED TO START
# 另外 logback-logstash.xml 不在 classpath 里（在模块根目录，没打进 jar），
# 且它的 logstash appender 指向 localhost:5044（环境里没有 logstash），
# 所以这里不指定 config，走 src/main/resources/logback.xml（有 console，docker logs 可见）。
logging:
  level:
    com.xhzb: info
    org.springframework: warn
    org.springframework.ai: info
    config: classpath:logback-logstash.xml

# Spring配置
spring:
  # AI 模型配置（容器里的 localhost 是容器自己，不能用 localhost）
  ai:
    openai:
      # DeepSeek 走 OpenAI 兼容协议
      base-url: ${AI_OPENAI_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: ${AI_OPENAI_CHAT_MODEL:deepseek-chat}
          temperature: 0.7
    ollama:
      # 本地部署的 Ollama，默认走 host.docker.internal
      # （deploy.sh 里已加 --add-host=host.docker.internal:host-gateway）
      base-url: ${AI_OLLAMA_BASE_URL:http://host.docker.internal:11434}
      chat:
        options:
          model: ${AI_OLLAMA_CHAT_MODEL:qwen3.5:0.8b}
          temperature: 0.7
      embedding:
        options:
          model: ${AI_OLLAMA_EMBEDDING_MODEL:qwen3-embedding:0.6b}
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 生产环境必须关掉热部署
      enabled: false
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/xhzb?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  # redis 配置
  data:
    redis:
      # 地址
      host: ${REDIS_HOST:localhost}
      # 端口，默认为6379
      port: ${REDIS_PORT:6379}
      # 数据库索引
      database: 0
      # 密码
      password: ${REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 10s
      jedis:
        pool:
          enabled: true

# 文件上传目录（Linux 路径，deploy.sh 会把宿主目录挂载到这里）
ruoyi:
  profile: ${UPLOAD_PATH:/home/ruoyi/uploadPath}

# 向量库专用 Redis（与业务 Redis 分开，端口不同）
xhzb:
  vector-store:
    host: ${VECTOR_REDIS_HOST:localhost}
    port: ${VECTOR_REDIS_PORT:6378}

# oss的配置，要根据自己实际情况来进行修改
oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
  accessKeyId: ${OSS_ACCESS_KEY_ID}
  accessKeySecret: ${OSS_ACCESS_KEY_SECRET}
  bucketName: ${OSS_BUCKET_NAME:}
